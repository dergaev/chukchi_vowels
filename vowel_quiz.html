<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vowel quiz</title>

<style>
:root {
  --bg: #f6f7fb;
  --card: #ffffff;
  --ink: #1f2328;
  --muted: #646b75;
  --line: #e6e8ee;
  --shadow: 0 14px 36px rgba(20, 24, 32, 0.10);
  --radius: 22px;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
}

.page {
  width: min(760px, 100%);
  margin: 0 auto;
  padding: 16px;
}

.hero,
.quiz-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.hero {
  padding: 20px;
  margin-bottom: 16px;
}

.quiz-card {
  padding: 22px;
}

h1 {
  margin: 0 0 8px 0;
  font-size: clamp(1.45rem, 4vw, 2.2rem);
  letter-spacing: -0.03em;
}

p {
  margin: 0;
  color: var(--muted);
  line-height: 1.5;
}

button {
  appearance: none;
  border: 0;
  border-radius: 999px;
  padding: 12px 18px;
  min-height: 46px;
  font-size: 1rem;
  font-weight: 750;
  cursor: pointer;
  transition: transform .12s ease, opacity .12s ease, box-shadow .12s ease;
}

button:active {
  transform: scale(.98);
}

button:disabled {
  cursor: not-allowed;
  opacity: .55;
}

.primary {
  background: #1f2328;
  color: white;
  box-shadow: 0 8px 20px rgba(31, 35, 40, 0.2);
}

.secondary {
  background: #eceff4;
  color: #1f2328;
}

.button-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.question-title {
  font-size: 1.35rem;
  margin: 0 0 4px 0;
}

.progress {
  font-weight: 800;
  color: var(--muted);
  white-space: nowrap;
}

.audio-panel {
  background: #f0f3f8;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px;
  text-align: center;
  margin: 16px 0;
}

.play {
  width: 100%;
  margin-top: 14px;
}

.choices {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 16px;
}

.choice {
  border-radius: 18px;
  min-height: 70px;
  font-size: 1.35rem;
  background: #eceff4;
  color: #1f2328;
}

.choice.correct {
  background: #caf7d7;
}

.choice.incorrect {
  background: #ffd3d3;
}

.feedback {
  min-height: 32px;
  margin-top: 16px;
  text-align: center;
  font-weight: 800;
}

.footer {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.footer button {
  flex: 1;
}

.score {
  text-align: center;
  font-size: clamp(3rem, 15vw, 5rem);
  font-weight: 900;
  letter-spacing: -0.06em;
  margin: 16px 0 8px;
}

.score-message {
  text-align: center;
  max-width: 38rem;
  margin: 0 auto;
}

.small-note {
  margin-top: 10px;
  font-size: .92rem;
  color: var(--muted);
}

@media (max-width: 680px) {
  .page {
    padding: 10px;
  }

  .hero,
  .quiz-card {
    padding: 16px;
    border-radius: 18px;
  }

  .topline {
    align-items: flex-start;
    flex-direction: column;
  }

  .choices {
    grid-template-columns: repeat(2, 1fr);
  }

  .choice {
    min-height: 64px;
  }

  .button-row,
  .footer {
    flex-direction: column;
  }

  button {
    width: 100%;
  }
}
</style>
</head>

<body>
<main class="page">
  <section class="hero">
    <h1>Тест на распознавание чукотских гласных</h1>
    <p>

    </p>
    <div class="button-row">
      <button class="primary" id="start">Начать тест</button>
    </div>
  </section>

  <section class="quiz-card" id="quiz">
    <p>Нажмите “Начать тест”, чтобы начать.</p>
  </section>
</main>

const VOWELS = ["a", "e", "i", "o", "u", "ə"];
const QUIZ_LENGTH = 10;

let quizItems = [];
let current = 0;
let score = 0;
let answered = false;
let currentAudio = null;

function shuffle(array) {
  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }

  return copy;
}

function sample(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function makeQuizItems() {
  const byVowel = {};

  for (const item of DATA) {
    if (!byVowel[item.vowel]) {
      byVowel[item.vowel] = [];
    }

    byVowel[item.vowel].push(item);
  }

  const selected = [];
  const usedFilenames = new Set();

  // Guarantee that every vowel appears at least once
  for (const vowel of VOWELS) {
    const item = sample(byVowel[vowel]);
    selected.push(item);
    usedFilenames.add(item.filename);
  }

  // Fill remaining quiz slots
  const remaining = DATA.filter(item => !usedFilenames.has(item.filename));

  while (selected.length < QUIZ_LENGTH) {
    const item = sample(remaining);

    if (!usedFilenames.has(item.filename)) {
      selected.push(item);
      usedFilenames.add(item.filename);
    }
  }

  return shuffle(selected);
}

function playAudio(filename) {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }

  currentAudio = new Audio(filename);

  currentAudio.play().catch(() => {
    alert(
      "Could not play audio file: " + filename +
      "\n\nMake sure the HTML file and the .wav files are in the same folder."
    );
  });
}

function startQuiz() {
  quizItems = makeQuizItems();
  current = 0;
  score = 0;
  answered = false;
  renderQuestion();
}

function renderQuestion() {
  answered = false;

  const item = quizItems[current];

  const buttons = VOWELS.map(vowel => `
    <button class="choice" data-vowel="${vowel}">
      ${vowel}
    </button>
  `).join("");

  document.getElementById("quiz").innerHTML = `
    <div class="topline">
      <div>
        <h1 class="question-title">Вопрос ${current + 1}</h1>
        <p>Послушайте аудио и выберите ответ.</p>
      </div>
      <div class="progress">${current + 1} / ${QUIZ_LENGTH}</div>
    </div>

    <div class="audio-panel">
      <p>Сегмент ${current + 1}</p>
      <button class="primary play" id="play">▶ Воспроизвести звук</button>
    </div>

    <div class="choices">
      ${buttons}
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="footer">
      <button class="secondary" id="restart">Заново</button>
      <button class="primary" id="next" disabled>Дальше</button>
    </div>
  `;

  document.getElementById("play").addEventListener("click", () => {
    playAudio(item.filename);
  });

  document.getElementById("restart").addEventListener("click", startQuiz);

  document.querySelectorAll(".choice").forEach(button => {
    button.addEventListener("click", () => chooseAnswer(button.dataset.vowel));
  });

  document.getElementById("next").addEventListener("click", nextQuestion);
}

function chooseAnswer(choice) {
  if (answered) return;

  answered = true;

  const item = quizItems[current];
  const correct = item.vowel;

  document.querySelectorAll(".choice").forEach(button => {
    const vowel = button.dataset.vowel;

    if (vowel === correct) {
      button.classList.add("correct");
    }

    if (vowel === choice && choice !== correct) {
      button.classList.add("incorrect");
    }

    button.disabled = true;
  });

  if (choice === correct) {
    score++;
    document.getElementById("feedback").textContent = "Верно!";
  } else {
    document.getElementById("feedback").textContent = "Правильный ответ: " + correct;
  }

  document.getElementById("next").disabled = false;
}

function nextQuestion() {
  if (current < quizItems.length - 1) {
    current++;
    renderQuestion();
  } else {
    renderScore();
  }
}

function renderScore() {
  let message = "Супер!";

  if (score === QUIZ_LENGTH) {
    message = "Идеально!";
  } else if (score >= Math.ceil(QUIZ_LENGTH * 0.8)) {
    message = "Хорошая работа!";
  } else if (score >= Math.ceil(QUIZ_LENGTH * 0.5)) {
    message = "Хорошая работа, но надо ещё попрактиковаться!";
  }

  document.getElementById("quiz").innerHTML = `
    <h1 style="text-align:center;">Тест завершён</h1>
    <div class="score">${score} / ${QUIZ_LENGTH}</div>
    <p class="score-message">${message}</p>

    <div class="footer">
      <button class="secondary" style="display:none;" id="review">Попробовать ещё</button>
      <button class="primary" id="again">Попробовать ещё</button>
    </div>
  `;

  document.getElementById("review").addEventListener("click", startQuiz);
  document.getElementById("again").addEventListener("click", startQuiz);
}

document.getElementById("start").addEventListener("click", startQuiz);
</script>
